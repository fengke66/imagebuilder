name: Build TX8 Max daede Image

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 把生成的固件发布到 GitHub Release
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      openwrt_version:
        description: 选择 ImmortalWrt 正式稳定版或快照
        required: true
        default: "25.12.0"
        type: choice
        options:
          - "25.12.0"
          - "24.10.6"
          - "25.12-SNAPSHOT"
      kernel_choice:
        description: 选择打包内核（如果是下拉菜单里没有的内核，请选 manual 并在下方手动输入）
        required: true
        default: "6.1.60"
        type: choice
        options:
          - "6.1.60"
          - "6.6.15"
          - "6.12.1"
          - "manual"
      manual_kernel:
        description: 手动填入内核版本（仅在上方选择 manual 时生效，例如 6.1.80）
        required: false
        default: ""
      rootfs_partsize:
        description: 根文件系统分区大小（MB）
        required: true
        default: "1024"
      daede_release_tag:
        description: luci-app-daede 的 release 版本 (默认 latest 取最新)
        required: true
        default: "latest"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-distutils \
            rsync unzip zstd file wget curl qemu-utils genisoimage jq

      - name: Determine Kernel
        id: kernel_set
        run: |
          if [ "${{ inputs.kernel_choice }}" = "manual" ]; then
            if [ -z "${{ inputs.manual_kernel }}" ]; then
              echo "错误：你选择了手动输入内核，但没有填写具体版本！"
              exit 1
            fi
            echo "FINAL_KERNEL=${{ inputs.manual_kernel }}" >> $GITHUB_ENV
          else
            echo "FINAL_KERNEL=${{ inputs.kernel_choice }}" >> $GITHUB_ENV
          fi

      - name: Build image
        env:
          OPENWRT_VERSION: ${{ inputs.openwrt_version }}
          AMLOGIC_KERNEL: ${{ env.FINAL_KERNEL }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
          DAEDE_RELEASE_TAG: ${{ inputs.daede_release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          chmod +x scripts/build-image.sh
          scripts/build-image.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-daede-tx8max
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: tx8max-v${{ inputs.openwrt_version }}-${{ github.run_number }}
          name: TX8-Max 固件 v${{ inputs.openwrt_version }} [内核-${{ env.FINAL_KERNEL }}]
          artifacts: out/*
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: out/BUILD-MANIFEST.txt
